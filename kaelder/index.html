<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Min kælder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#EEF2F6">
<link rel="icon" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Samme udtryk som Vinholdet Stats (Blindervenner · Sten): lys skifer, Archivo + Figtree.
   Layout: topbjælke med faner, fast filterlinje, kort i gitter; én kolonne på mobil. */
:root{
  --bg:#EEF2F6; --paper:#F8FAFC; --card:#F8FAFC; --input:#FFFFFF;
  --ink:#1F2A37; --ink-2:#4F5D6E; --ink-3:#66727F;
  --line:rgba(31,42,55,.14); --line-2:rgba(31,42,55,.45); --line-strong:1.5px solid #1F2A37; --wash:rgba(31,42,55,.06);
  --accent:#4A6A8C; --accent-2:#9DB4CC; --accent-wash:rgba(74,106,140,.14); --on-dark:#EEF2F6;
  --c-hvid:#D8C77E; --c-rod:#7B2433; --c-orange:#D88A3C; --c-rose:#E6A3A8; --c-mouss:#9DB4CC; --c-offdry:#F1E6B2; --c-sweet:#8A6FA3; --c-fort:#A86F2A; --c-other:#C9C1B6;
  --s1:#4A6A8C; --s2:#7B2433; --s3:#B07D1E; --s4:#5E7A3A; --s5:#8A6FA3; --s6:#B5643A; --s7:#9DB4CC; --s8:#1F2A37; --s9:#3E8C84; --s10:#C48BAA; --s11:#8C6D3F; --s12:#5B5F97;
  --good:#5E7A3A; --warn:#B07D1E; --bad:#A0472E;
  --f-display:'Archivo', 'Arial Narrow', sans-serif;
  --f-body:'Figtree', -apple-system, 'Segoe UI', sans-serif;
  --f-mono:'Figtree', -apple-system, sans-serif;
  --r:14px; --r-sm:8px; --r-btn:12px;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
html{overflow-x:clip}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:25}
body{background:var(--bg);color:var(--ink);font:17px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ink);text-underline-offset:3px}
h1,h2,h3{font-family:var(--f-display);font-weight:800;font-stretch:112%;letter-spacing:-.03em;margin:0;text-wrap:balance;color:var(--ink)}
h1{font-size:clamp(34px,6vw,46px);line-height:1}
h2{font-size:clamp(26px,4vw,34px);line-height:1}
h3{font-size:20px;line-height:1.1;letter-spacing:-.02em}
.num,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:.92em}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.eyebrow{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);font-weight:700}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{max-width:1240px;margin:0 auto;padding:env(safe-area-inset-top,0px) max(16px, env(safe-area-inset-right,0px)) 80px max(16px, env(safe-area-inset-left,0px))}
.side{display:flex;flex-direction:column;gap:10px;padding:16px 0 12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:32px;height:32px;flex:none}
.brand b{font-family:var(--f-display);font-weight:800;font-stretch:112%;font-size:16px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand b span{font-family:var(--f-body);font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.12em;margin-left:8px;vertical-align:middle}
.brand .upd{margin-left:auto;font-size:14px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px}
.nav::-webkit-scrollbar{display:none}
@media (min-width:761px){.nav{flex-wrap:wrap;overflow:visible}}
.nav a{flex:none;padding:7px 13px;border-radius:var(--r-btn);color:var(--ink-2);text-decoration:none;font-weight:700;font-size:15px;white-space:nowrap;border:1.5px solid transparent}
.nav a:hover{color:var(--ink);border-color:var(--line-2)}
.nav a.on{background:#1F2A37;color:var(--on-dark)}
.nav .sep{flex:none;width:1px;background:var(--line);margin:6px 4px}
.side .foot{display:none}
.gear{flex:none;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:var(--r-btn);background:var(--paper);color:var(--ink)}
.gear:hover{border-color:#1F2A37}
.gear.on{background:#1F2A37;color:var(--on-dark)}
.curb{font:700 14px var(--f-body,inherit);margin-right:8px;width:auto;min-width:36px;padding:0 9px}
#view{touch-action:pan-y}
#view.dragging{will-change:transform}
#peek{position:absolute;z-index:1;overflow:hidden;pointer-events:none;will-change:transform}
.chart svg g.hot rect:not([fill=transparent]),.chart svg circle.hot{filter:brightness(.8)}
.chart svg circle.hot{r:6}
.subnav{margin-bottom:18px}

.main{min-width:0}
.fbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(238,242,246,.96);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 16px 10px;margin:0 -16px 24px}
.fbar-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--wash);border-radius:99px;padding:3px 6px 3px 12px;font-size:14px;font-weight:600;border:0}
.chip.out{background:transparent;box-shadow:inset 0 0 0 1px var(--line-2)}
.chip b{font-weight:800}
.chip button{border:0;background:none;cursor:pointer;color:var(--ink-3);font-size:17px;line-height:1;padding:0 4px}
.chip button:hover{color:var(--bad)}
.fbtn{display:inline-flex;align-items:center;gap:7px;background:var(--paper);border:1.5px solid #1F2A37;border-radius:var(--r-btn);padding:5px 12px;font-weight:700;font-size:14px;color:#1F2A37;cursor:pointer;white-space:nowrap}
.fbtn:hover{background:#FFFFFF}
.fbtn.loc{background:#1F2A37;color:var(--on-dark)}
.fbtn .n{background:var(--accent-2);color:#1F2A37;border-radius:99px;font-size:12px;min-width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.fsum{margin-left:auto;font-size:14px;color:var(--ink-2);font-weight:600}

.btn{-webkit-appearance:none;appearance:none;border:1.5px solid #1F2A37;background:rgba(248,250,252,.9);border-radius:var(--r-btn);padding:10px 16px;cursor:pointer;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:#1F2A37}
@media (hover:hover){.btn:hover{background:#FFFFFF}.btn.pri:hover{background:#2E3D50}}
.btn.pri{background:#1F2A37;color:var(--on-dark)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{border:0;background:none;padding:0;color:#1F2A37;cursor:pointer;font-weight:700;text-decoration:underline;text-underline-offset:3px;text-align:left}
.seg{display:inline-flex;border:1.5px solid #1F2A37;border-radius:var(--r-btn);overflow:hidden;background:var(--paper)}
.seg button{border:0;background:var(--paper);padding:5px 11px;font-size:14px;cursor:pointer;color:var(--ink-2);font-weight:600}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:#1F2A37;color:var(--on-dark)}
select{-webkit-appearance:none;appearance:none;border:1.5px solid #1F2A37;border-radius:var(--r-sm);background:#FFFFFF linear-gradient(45deg,transparent 50%,#1F2A37 50%) calc(100% - 15px) 52%/5px 5px no-repeat,#FFFFFF linear-gradient(135deg,#1F2A37 50%,transparent 50%) calc(100% - 10px) 52%/5px 5px no-repeat;padding:6px 30px 6px 11px;font-size:15px;min-width:0;max-width:100%;cursor:pointer}
input[type=text],input[type=number],input[type=search],input[type=url],input[type=password],textarea{border:none;border-bottom:2px solid #1F2A37;border-radius:0;background:transparent;padding:6px 0;min-width:0;font-size:16px}
input:focus,textarea:focus{outline:none;border-bottom-color:var(--accent)}
textarea{width:100%;resize:vertical;border:1.5px solid #1F2A37;border-radius:var(--r-sm);background:#FFFFFF;padding:10px 12px}
label.inl{display:inline-flex;gap:6px;align-items:center;font-size:15px}

.page-head{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.page-head p{margin:10px 0 0;color:var(--ink-2);max-width:68ch;font-size:16px}
.crumb{font-size:14px;color:var(--ink-3);margin-bottom:8px;font-weight:600}
.crumb .link{font-size:14px}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.panel{background:var(--card);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);border:1px solid rgba(31,42,55,.16);border-radius:var(--r);padding:22px;min-width:0}
.panel.flat{background:none;border:0;padding:0}
.ph{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;margin-bottom:14px}
.ph h2,.ph h3{font-family:var(--f-body);font-stretch:100%;font-size:12px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ink)}
.ph .def{font-size:14px;color:var(--ink-3);width:100%;margin-top:-4px;line-height:1.4}
.section{margin-top:30px}
.section>h2{margin-bottom:14px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:14px}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.kpis .kpi{padding:14px}.kpis .kpi .v{font-size:24px}}
.kpi{background:var(--card);border:1px solid rgba(31,42,55,.16);border-radius:var(--r);padding:18px 18px 16px;min-width:0;text-align:left}
.kpi .v{font-family:var(--f-display);font-weight:900;font-stretch:112%;font-size:clamp(28px,3.1vw,42px);letter-spacing:-.05em;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums;margin-top:10px;order:2}
.kpi{display:flex;flex-direction:column}
.kpi .l{font-size:12px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2);order:1}
.kpi .s{font-size:14px;color:var(--ink-3);margin-top:8px;order:3;line-height:1.35}

/* vandrette søjler */
.bars{display:flex;flex-direction:column;gap:2px}
.bar{display:grid;grid-template-columns:minmax(96px,38%) minmax(0,1fr) auto;gap:12px;align-items:center;padding:6px 4px;border-radius:6px;cursor:pointer;border:0;background:none;text-align:left;width:100%;font-family:var(--f-body)}
.bar:hover{background:rgba(31,42,55,.05)}
.bar .nm{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tr{height:14px;background:rgba(31,42,55,.06);border-radius:3px;position:relative;overflow:hidden}
.bar .fl{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:3px;box-shadow:inset 0 0 0 1px rgba(31,42,55,.15)}
.bar .vl{font-size:14px;color:var(--ink-2);text-align:right;min-width:64px;font-variant-numeric:tabular-nums;font-weight:600}
.more{margin-top:10px;display:flex;gap:10px;align-items:center;font-size:14px;cursor:pointer}
details>summary{list-style:none}
details>summary::-webkit-details-marker{display:none}

.stack{display:flex;height:18px;border-radius:99px;overflow:hidden;gap:3px}
.stack button{border:0;padding:0;cursor:pointer;min-width:3px;box-shadow:inset 0 0 0 1px rgba(31,42,55,.15)}
.stack button:hover{filter:brightness(1.08)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;font-size:14px}
.legend button,.legend span{border:0;background:none;padding:0;cursor:pointer;display:inline-flex;gap:7px;align-items:center;color:var(--ink);font-weight:600}
.legend .faint{font-weight:500}
.sw{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none;box-shadow:inset 0 0 0 1px rgba(31,42,55,.25)}

svg text{fill:var(--ink-3);font-family:var(--f-body)}
svg .ax{stroke:var(--line-2)} svg .gr{stroke:rgba(31,42,55,.10)}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;max-width:100%;height:auto}
.tip{position:fixed;z-index:100;pointer-events:none;background:#1F2A37;color:var(--on-dark);padding:7px 11px;border-radius:var(--r-sm);font-size:14px;max-width:300px;line-height:1.35;display:none;box-shadow:0 8px 24px rgba(31,42,55,.25)}

/* tabeller */
.tw{overflow-x:auto;border-radius:var(--r-sm)}
.panel .tw{margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-2);font-weight:700;border-bottom:1.5px solid #1F2A37;white-space:nowrap;background:transparent}
th.s{cursor:pointer} th.s:hover{color:var(--ink)} th.on{color:var(--ink)}
td.r,th.r{text-align:right;white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:rgba(31,42,55,.05)}
tbody tr:last-child td{border-bottom:0}
table.wt tbody.grp tr.gd{display:none}
table.wt tbody.grp.open tr.gd{display:table-row}
table.wt tr.gh{cursor:pointer}
table.wt tr.gh:hover td{background:rgba(31,42,55,.05)}
table.wt tbody.grp.open tr.gh td{border-bottom-color:transparent;background:rgba(31,42,55,.04)}
table.wt tr.gd td{background:rgba(31,42,55,.02)}
table.wt tr.gd td:first-child{padding-left:32px}
table.wt tr.gd td{padding-top:6px;padding-bottom:6px}
table.wt .sm{display:none;font-size:13px;color:var(--ink-3);margin-top:1px;font-weight:400}
table.pt .sm{display:none;font-size:13px;color:var(--ink-3);font-weight:400}
@media (max-width:760px){
  table.wt .xm,table.pt .xm,table.dv .xm{display:none}
  table.wt .sm,table.pt .sm{display:block}
  table.wt td,table.wt th{padding:7px 6px}
  table.wt tr.gd td{padding-top:5px;padding-bottom:5px}
  table.wt tr.gd td:first-child{padding-left:26px}
  table.wt td:first-child{width:100%}
}
table.wt tbody.grp:not(:last-child) tr:last-child td{border-bottom:1px solid var(--line)}
.chev{display:inline-block;width:8px;height:8px;border-right:2px solid #1F2A37;border-bottom:2px solid #1F2A37;transform:rotate(-45deg);margin:0 10px 1px 2px;transition:transform .15s}
tbody.grp.open .chev{transform:rotate(45deg)}
.hm th{white-space:normal;vertical-align:bottom;line-height:1.2;min-width:34px}
.hm td.c{text-align:right;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer;min-width:34px;padding-left:5px;padding-right:5px}
.hm td.c:hover{outline:2px solid #1F2A37;outline-offset:-2px}
.hm td.z{color:var(--ink-3);cursor:default;font-weight:400}
.hm td.rowh{position:sticky;left:0;background:var(--paper);white-space:nowrap;font-weight:600;z-index:1}
.hm th.rowh{position:sticky;left:0;background:var(--paper);z-index:2}
.tag{display:inline-block;font-size:12px;font-weight:600;background:rgba(31,42,55,.06);border-radius:99px;padding:1px 8px;color:var(--ink-2);white-space:nowrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:0;box-shadow:inset 0 0 0 1px rgba(31,42,55,.25)}

.note{display:block;padding:10px 14px;background:rgba(248,250,252,.9);border:1px solid rgba(31,42,55,.16);border-radius:var(--r);font-size:15px;color:var(--ink-2)}
.note a{font-weight:700}
.note.warn{border-left:4px solid var(--warn)} .note.bad{border-left:4px solid var(--bad)} .note.good{border-left:4px solid var(--good)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.fact{background:var(--card);border:1px solid rgba(31,42,55,.16);border-radius:var(--r);padding:18px;text-align:left;cursor:pointer;font-family:var(--f-body)}
.fact:hover{border-color:#1F2A37}
.fact b{font-family:var(--f-display);font-weight:900;font-stretch:112%;letter-spacing:-.04em;font-size:30px;line-height:1.05;display:block;margin-bottom:6px;color:var(--ink)}
.fact span{font-size:15px;color:var(--ink-2)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:14px}
.empty{padding:40px 20px;text-align:center;color:var(--ink-2)}
.empty h2{margin-bottom:10px}

/* skuffe / popover */
.scrim{position:fixed;inset:0;background:rgba(31,42,55,.5);z-index:60;display:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--paper);z-index:61;overflow:auto;padding:26px max(22px, env(safe-area-inset-right,0px)) 40px 22px;border-left:1.5px solid #1F2A37;display:none}
.drawer.open,.scrim.open{display:block}
.drawer .x{position:absolute;top:14px;right:max(14px, env(safe-area-inset-right,0px));width:36px;height:36px;border:1px solid var(--line);border-radius:var(--r-btn);background:var(--paper);font-size:1.3rem;cursor:pointer;color:var(--ink)}
.drawer h2{font-size:28px;padding-right:40px}
.pop{position:fixed;z-index:70;background:var(--paper);border:1.5px solid #1F2A37;border-radius:var(--r);box-shadow:0 8px 24px rgba(31,42,55,.18);width:min(340px,calc(100vw - 24px));max-height:min(480px,70vh);display:none;flex-direction:column;overflow:hidden}
.pop.open{display:flex}
.pop .ph2{padding:14px 14px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.pop .ph2>b{font-family:var(--f-display);font-weight:800;font-stretch:112%;font-size:20px;letter-spacing:-.02em}
.pop .opts{overflow:auto;padding:4px 0}
.pop .opt{display:flex;gap:9px;align-items:center;padding:6px 14px;font-size:15px;cursor:pointer}
.pop .opt:hover{background:rgba(31,42,55,.05)}
.pop .opt .c{margin-left:auto;font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.pop .pf{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:space-between;align-items:center}
input[type=checkbox]{accent-color:#1F2A37;width:16px;height:16px}
dl.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 18px;margin:0;font-size:15px}
dl.kv dt{color:var(--ink-3);font-weight:600} dl.kv dd{margin:0}

/* vinkort */
.wl{background:var(--card);border:1px solid rgba(31,42,55,.16);border-radius:var(--r);padding:52px max(20px,7%) 56px;max-width:840px;margin:0 auto}
.wl-head{text-align:center;margin-bottom:34px}
.wl-head h1{font-size:clamp(40px,7vw,64px);letter-spacing:-.04em}
.wl-head .sub{font-size:12px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2);margin:10px 0}
.wl-head .sub:first-child{color:var(--accent)}
.wl-toc{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;font-size:14px;font-weight:700;margin-bottom:26px}
.wl-sec{margin-top:44px}
.wl-sec>h2{font-size:clamp(26px,4vw,34px);text-align:center;margin-bottom:4px;break-after:avoid}
.wl-sec>.orn{text-align:center;color:var(--accent-2);margin-bottom:10px;font-size:14px;letter-spacing:.5em}
.wl-reg{margin-top:30px}
.wl-reg>h3{font-family:var(--f-body);font-stretch:100%;font-size:12px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:var(--ink);border-bottom:1.5px solid #1F2A37;padding-bottom:6px;margin-bottom:4px;break-after:avoid}
.wl-reg>h3 span{color:var(--ink-3);font-weight:500}
.wl-prod{margin-top:18px;break-inside:avoid-page}
.wl-prod>h4{font-family:var(--f-body);font-weight:600;font-size:17px;margin:0 0 4px;letter-spacing:0;break-after:avoid}
.wl-line{display:grid;grid-template-columns:3.6em minmax(0,1fr) minmax(0,28%) 3.4em;gap:0 18px;align-items:baseline;padding:2px 0;font-size:16px;break-inside:avoid}
.wl-line.priv{grid-template-columns:3.6em minmax(0,1fr) minmax(0,24%) 4.6em 3.4em}
.wl-line .yr{font-variant-numeric:tabular-nums;color:var(--ink)}
.wl-line .d{color:var(--ink)}
.wl-line .g{color:var(--ink-2)}
.wl-line .sz{font-size:12px;font-weight:600;background:rgba(31,42,55,.06);border-radius:99px;padding:1px 7px;color:var(--ink-2);margin-left:8px;white-space:nowrap}
.wl-line .lc{font-size:13px;color:var(--ink-3);margin-left:8px}
.wl-line .q,.wl-line .pr{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.wl-line .q{color:var(--ink)}
.wl-line .pr{color:var(--ink-3);font-size:14px}
@media (max-width:560px){.wl-line{grid-template-columns:3.2em minmax(0,1fr) 3em;gap:0 10px;font-size:15px}.wl-line .g{grid-column:2;grid-row:2;font-size:13px}.wl-line .q{grid-column:3;grid-row:1}.wl-line.priv{grid-template-columns:3.2em minmax(0,1fr) 3em}.wl-line .pr{grid-column:3;grid-row:2}}
.wl-foot{margin-top:46px;text-align:center;font-size:13px;color:var(--ink-3)}

/* krydstabel på mobil */
.hml{display:flex;flex-direction:column}
.hml-r{padding:10px 0;border-bottom:1px solid var(--line)}
.hml-r:last-child{border-bottom:0}
.hml-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:6px;font-weight:600}
.hml-c{display:flex;flex-wrap:wrap;gap:5px}
.hml-chip{border:0;border-radius:99px;padding:3px 10px;font-size:13px;font-family:var(--f-body);cursor:pointer;color:var(--ink);box-shadow:inset 0 0 0 1px rgba(31,42,55,.12)}
.hml-chip b{font-weight:800;margin-left:2px}

/* prisniveau */
.pl{display:flex;flex-direction:column}
.pl-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;padding:10px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%;font-family:var(--f-body)}
.pl-row:last-child{border-bottom:0}
.pl-row:hover{background:rgba(31,42,55,.04)}
.pl-n{font-weight:600;font-size:15px}
.pl-v{font-size:14px;color:var(--ink-2)}
.pl-v b{color:var(--ink)}
.pl-b{grid-column:1/-1;position:relative;height:14px}
.pl-b i{position:absolute;top:6px;height:2px;background:var(--line-2)}
.pl-b em{position:absolute;top:1px;height:12px;background:var(--accent-wash);border:1.5px solid var(--accent);border-radius:3px}
.pl-b s{position:absolute;top:-1px;height:16px;width:3px;margin-left:-1px;background:#1F2A37;border-radius:2px}

/* chat */
.chat{display:flex;flex-direction:column;gap:14px}
.msg{max-width:74ch}
.msg.u{align-self:flex-end;background:#1F2A37;color:var(--on-dark);padding:10px 15px;border-radius:var(--r)}
.pickc{background:var(--card);border:1px solid rgba(31,42,55,.16);border-radius:var(--r);padding:16px 18px;display:grid;gap:5px}
.pickc .role{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);font-weight:700}

@media (max-width:760px){
  body{font-size:16px}
  .fbar{padding:10px 16px 8px}
  .fbar-row{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .fbar-row::-webkit-scrollbar{display:none}
  .fsum{display:none}
  .panel{padding:18px}
  .bar{grid-template-columns:minmax(84px,40%) minmax(0,1fr) auto;gap:8px}
  .wl{padding:30px 16px 36px}
  .brand .upd{font-size:12px}
}
@media print{
  @page{size:A4;margin:18mm 16mm 18mm}
  body{background:#fff;color:#111}
  .side,.fbar,.noprint,.tip,.drawer,.scrim{display:none!important}
  .app{max-width:none;padding:0}
  .wl{border:0;padding:0;max-width:none;background:#fff;backdrop-filter:none}
  a{color:#111;text-decoration:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
