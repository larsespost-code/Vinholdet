<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Min kælder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: venstre navigationsspalte på desktop, fast filterlinje øverst i indholdet; én kolonne på mobil. */
:root{
  --bg:#F5F4F1; --paper:#FFFFFF; --ink:#1E1A1C; --ink-2:#5A5357; --ink-3:#8C8488;
  --line:#E2DEDB; --line-2:#CFC8C6; --wash:#EEEAE7;
  --accent:#7A1F35; --accent-2:#A23A52; --accent-wash:#F3E6E9;
  --c-hvid:#C9A93C; --c-rod:#7A1F35; --c-orange:#C9722B; --c-rose:#D98897; --c-mouss:#7F95A8; --c-other:#9A8F94;
  --s1:#7A1F35; --s2:#3F6B73; --s3:#C9722B; --s4:#6A5A8C; --s5:#8C8A3A; --s6:#B8586E; --s7:#4F7F5A; --s8:#8E6B4D;
  --good:#2F6B4A; --warn:#9A6A12; --bad:#A3302B;
  --f-display:'Newsreader', 'Iowan Old Style', Georgia, serif;
  --f-body:'Instrument Sans', -apple-system, 'Segoe UI', sans-serif;
  --f-mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141113; --paper:#1D191B; --ink:#EEE8EA; --ink-2:#B8AEB2; --ink-3:#857B80;
  --line:#2F292C; --line-2:#433B3F; --wash:#26201F;
  --accent:#E07A92; --accent-2:#F0A0B2; --accent-wash:#3A1F27;
  --c-hvid:#D9BE5C; --c-rod:#C2485F; --c-orange:#DD8A46; --c-rose:#E8A3B0; --c-mouss:#98AEC0; --c-other:#9A8F94;
  --s1:#D0607A; --s2:#6FA2AA; --s3:#DD8A46; --s4:#9E8CC4; --s5:#B8B55A; --s6:#E08AA0; --s7:#7FB08A; --s8:#C49A76;
  --good:#7FC49A; --warn:#E0B456; --bad:#E57A72; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141113; --paper:#1D191B; --ink:#EEE8EA; --ink-2:#B8AEB2; --ink-3:#857B80;
  --line:#2F292C; --line-2:#433B3F; --wash:#26201F;
  --accent:#E07A92; --accent-2:#F0A0B2; --accent-wash:#3A1F27;
  --c-hvid:#D9BE5C; --c-rod:#C2485F; --c-orange:#DD8A46; --c-rose:#E8A3B0; --c-mouss:#98AEC0; --c-other:#9A8F94;
  --s1:#D0607A; --s2:#6FA2AA; --s3:#DD8A46; --s4:#9E8CC4; --s5:#B8B55A; --s6:#E08AA0; --s7:#7FB08A; --s8:#C49A76;
  --good:#7FC49A; --warn:#E0B456; --bad:#E57A72; color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--f-display);font-weight:500;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1{font-size:2rem;line-height:1.15}
h2{font-size:1.35rem;line-height:1.2}
h3{font-size:1.05rem}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line);padding:22px 14px 22px 18px;display:flex;flex-direction:column;gap:18px;background:var(--bg)}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 6px}
.brand b{font-family:var(--f-display);font-size:1.55rem;font-weight:500;letter-spacing:-.01em}
.brand span{font-size:.75rem;color:var(--ink-3)}
.nav{display:flex;flex-direction:column;gap:1px}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:var(--r);color:var(--ink-2);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--wash);color:var(--ink)}
.nav a.on{background:var(--accent-wash);color:var(--accent)}
.nav .sep{height:1px;background:var(--line);margin:8px 10px}
.side .foot{margin-top:auto;font-size:.75rem;color:var(--ink-3);padding:0 8px;line-height:1.45}

.main{min-width:0;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 60px}
@media (min-width:900px){.main{padding-left:32px;padding-right:max(32px, env(safe-area-inset-right, 0px))}}
.fbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 0 10px;margin-bottom:22px}
.fbar-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--paper);border-radius:999px;padding:3px 6px 3px 11px;font-size:.82rem}
.chip.out{border-style:dashed}
.chip b{font-weight:600}
.chip button{border:0;background:none;cursor:pointer;color:var(--ink-3);font-size:1rem;line-height:1;padding:0 4px}
.chip button:hover{color:var(--accent)}
.fbtn{border:1px solid var(--line-2);background:var(--paper);border-radius:var(--r);padding:5px 10px;font-size:.85rem;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.fbtn:hover{border-color:var(--ink-3)}
.fbtn.loc{border-color:var(--accent);color:var(--accent);font-weight:600}
.fbtn .n{font-family:var(--f-mono);font-size:.75rem;background:var(--accent);color:var(--paper);border-radius:999px;padding:0 6px}
.fsum{margin-left:auto;font-size:.82rem;color:var(--ink-2)}

.btn{border:1px solid var(--line-2);background:var(--paper);border-radius:var(--r);padding:7px 13px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.btn.pri:hover{background:var(--accent-2)}
.btn.sm{padding:4px 9px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;background:var(--paper)}
.seg button{border:0;background:none;padding:4px 10px;font-size:.82rem;cursor:pointer;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ink);color:var(--paper)}
select,input[type=text],input[type=number],input[type=search],input[type=url],input[type=password],textarea{border:1px solid var(--line-2);background:var(--paper);border-radius:var(--r);padding:6px 9px;min-width:0}
textarea{width:100%;resize:vertical}
label.inl{display:inline-flex;gap:6px;align-items:center;font-size:.88rem}

.page-head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.page-head p{margin:6px 0 0;color:var(--ink-2);max-width:65ch}
.crumb{font-size:.82rem;color:var(--ink-3);margin-bottom:4px}
.crumb button{font-size:.82rem}

.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 16px;min-width:0}
.panel.flat{background:none;border:0;padding:0}
.ph{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.ph h2,.ph h3{font-size:1.15rem}
.ph .def{font-size:.78rem;color:var(--ink-3);width:100%;margin-top:-4px}
.section{margin-top:34px}
.section>h2{margin-bottom:14px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--paper);padding:14px 16px;min-width:0;text-align:left;border:0;cursor:default}
.kpi .v{font-family:var(--f-display);font-size:1.9rem;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:.8rem;color:var(--ink-2);margin-top:2px}
.kpi .s{font-size:.75rem;color:var(--ink-3);margin-top:2px}

/* vandrette søjler */
.bars{display:flex;flex-direction:column;gap:3px}
.bar{display:grid;grid-template-columns:minmax(90px,38%) minmax(0,1fr) auto;gap:10px;align-items:center;padding:3px 4px;border-radius:4px;cursor:pointer;border:0;background:none;text-align:left;width:100%}
.bar:hover{background:var(--wash)}
.bar .nm{font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tr{height:12px;background:var(--wash);border-radius:2px;position:relative;overflow:hidden}
.bar .fl{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:2px}
.bar .vl{font-family:var(--f-mono);font-size:.8rem;color:var(--ink-2);text-align:right;min-width:64px;font-variant-numeric:tabular-nums}
.bar.other{cursor:default}.bar.other .fl{background:var(--ink-3)}
.more{margin-top:8px;display:flex;gap:10px;align-items:center;font-size:.85rem}

.stack{display:flex;height:30px;border-radius:4px;overflow:hidden;gap:2px}
.stack button{border:0;padding:0;cursor:pointer;min-width:3px;position:relative}
.stack button:hover{filter:brightness(1.1)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:.84rem}
.legend button{border:0;background:none;padding:0;cursor:pointer;display:inline-flex;gap:6px;align-items:center;color:var(--ink)}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block;flex:none}

svg text{fill:var(--ink-2);font-family:var(--f-body)}
svg .ax{stroke:var(--line-2)} svg .gr{stroke:var(--line)}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;max-width:100%;height:auto}
.tip{position:fixed;z-index:100;pointer-events:none;background:var(--ink);color:var(--paper);padding:6px 9px;border-radius:4px;font-size:.8rem;max-width:280px;line-height:1.35;display:none}

/* tabeller */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:600;background:var(--paper);position:sticky;top:0;white-space:nowrap}
th.s{cursor:pointer} th.s:hover{color:var(--ink)} th.on{color:var(--accent)}
td.r,th.r{text-align:right}
tr.click{cursor:pointer} tr.click:hover td{background:var(--wash)}
tbody tr:last-child td{border-bottom:0}
.hm td.c{text-align:right;font-family:var(--f-mono);font-size:.8rem;cursor:pointer;min-width:46px}
.hm td.c:hover{outline:2px solid var(--accent);outline-offset:-2px}
.hm td.z{color:var(--ink-3);cursor:default}
.hm th.rowh{position:sticky;left:0;z-index:1}
.hm td.rowh{position:sticky;left:0;background:var(--paper);white-space:nowrap;font-weight:500}
.tag{display:inline-block;font-size:.72rem;border:1px solid var(--line-2);border-radius:3px;padding:0 5px;color:var(--ink-2);white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}

.note{border-left:3px solid var(--line-2);padding:8px 12px;background:var(--wash);border-radius:0 var(--r) var(--r) 0;font-size:.88rem;color:var(--ink-2)}
.note.warn{border-color:var(--warn)} .note.bad{border-color:var(--bad)} .note.good{border-color:var(--good)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:10px}
.fact{border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:12px 14px;text-align:left;cursor:pointer}
.fact:hover{border-color:var(--ink-3)}
.fact b{font-family:var(--f-display);font-size:1.3rem;font-weight:500;display:block}
.fact span{font-size:.84rem;color:var(--ink-2)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:12px}
.empty{padding:40px 20px;text-align:center;color:var(--ink-2)}

/* skuffe / dialog */
.scrim{position:fixed;inset:0;background:rgba(20,14,16,.42);z-index:60;display:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--paper);z-index:61;overflow:auto;padding:22px max(22px, env(safe-area-inset-right,0px)) 40px 22px;box-shadow:-10px 0 30px rgba(0,0,0,.15);display:none}
.drawer.open,.scrim.open{display:block}
.drawer .x{position:absolute;top:12px;right:max(12px, env(safe-area-inset-right,0px));border:0;background:none;font-size:1.5rem;cursor:pointer;color:var(--ink-3)}
.pop{position:fixed;z-index:70;background:var(--paper);border:1px solid var(--line-2);border-radius:var(--r);box-shadow:0 10px 30px rgba(0,0,0,.18);width:min(340px,calc(100vw - 24px));max-height:min(480px,70vh);display:none;flex-direction:column}
.pop.open{display:flex}
.pop .ph2{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.pop .opts{overflow:auto;padding:4px 0}
.pop .opt{display:flex;gap:8px;align-items:center;padding:5px 12px;font-size:.88rem;cursor:pointer}
.pop .opt:hover{background:var(--wash)}
.pop .opt .c{margin-left:auto;font-family:var(--f-mono);font-size:.75rem;color:var(--ink-3)}
.pop .pf{padding:8px 12px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:space-between;align-items:center}
dl.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 16px;margin:0;font-size:.88rem}
dl.kv dt{color:var(--ink-3)} dl.kv dd{margin:0}

/* vinkort */
.wl{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:48px max(20px,6%) 56px;max-width:820px;margin:0 auto;font-family:var(--f-display)}
.wl-head{text-align:center;margin-bottom:36px}
.wl-head h1{font-size:2.6rem;font-weight:400;letter-spacing:.02em}
.wl-head .sub{font-family:var(--f-body);font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-top:8px}
.wl-toc{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-family:var(--f-body);font-size:.82rem;margin-bottom:30px}
.wl-sec{margin-top:40px;break-inside:auto}
.wl-sec>h2{font-size:1.15rem;font-weight:500;letter-spacing:.22em;text-transform:uppercase;text-align:center;color:var(--accent);margin-bottom:6px;break-after:avoid}
.wl-sec>.orn{text-align:center;color:var(--ink-3);margin-bottom:12px;font-size:.9rem}
.wl-cty{margin-top:22px}
.wl-cty>h3{font-family:var(--f-body);font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--ink-2);border-bottom:1px solid var(--line);padding-bottom:4px;break-after:avoid}
.wl-reg{margin-top:12px;break-inside:avoid-page}
.wl-reg>h4{font-family:var(--f-display);font-style:italic;font-weight:400;font-size:1.08rem;margin:0 0 4px;break-after:avoid}
.wl-line{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:0 14px;align-items:baseline;padding:3px 0;font-size:1.02rem;break-inside:avoid}
.wl-line .p{font-variant:small-caps;letter-spacing:.03em}
.wl-line .d{color:var(--ink-2)}
.wl-line .sz{font-family:var(--f-body);font-size:.75rem;color:var(--ink-3);margin-left:6px}
.wl-line .yr{font-variant-numeric:oldstyle-nums tabular-nums;text-align:right;min-width:3.2em}
.wl-line .q{font-family:var(--f-body);font-size:.82rem;color:var(--ink-2);text-align:right;min-width:3.6em;font-variant-numeric:tabular-nums}
.wl-line .pr{font-family:var(--f-body);font-size:.75rem;color:var(--ink-3)}
.wl-foot{margin-top:46px;text-align:center;font-family:var(--f-body);font-size:.75rem;color:var(--ink-3)}

/* chat */
.chat{display:flex;flex-direction:column;gap:14px}
.msg{max-width:72ch}
.msg.u{align-self:flex-end;background:var(--accent-wash);padding:10px 14px;border-radius:var(--r)}
.pickc{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--paper);display:grid;gap:4px}
.pickc .role{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}

@media (max-width:899px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px max(16px, env(safe-area-inset-left,0px)) 8px;gap:8px}
  .brand{flex-direction:row;align-items:baseline;gap:10px;padding:0}
  .brand b{font-size:1.3rem}
  .nav{flex-direction:row;overflow-x:auto;gap:2px;padding-bottom:4px;scrollbar-width:none}
  .nav a{white-space:nowrap;padding:6px 10px}
  .nav .sep,.side .foot{display:none}
  h1{font-size:1.6rem}
  .bar{grid-template-columns:minmax(80px,40%) minmax(0,1fr) auto}
  .wl{padding:28px 16px 36px}
  .wl-head h1{font-size:2rem}
}
@media print{
  @page{size:A4;margin:18mm 16mm 18mm}
  body{background:#fff;color:#111}
  .side,.fbar,.noprint,.tip,.drawer,.scrim{display:none!important}
  .app{display:block}.main{padding:0}
  .wl{border:0;padding:0;max-width:none}
  .wl-sec{break-before:auto}
  .wl-line .pr{color:#555}
  a{color:#111;text-decoration:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side noprint">
    <div class="brand"><b>Min kælder</b><span id="src-line">Indlæser …</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot" id="foot"></div>
  </aside>
  <main class="main">
    <div class="fbar noprint" id="fbar"></div>
    <div id="view"></div>
  </main>
</div>
<div class="tip" id="tip" role="tooltip"></div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-modal="true" role="dialog"><button class="x" id="drawer-x" aria-label="Luk">×</button><div id="drawer-body"></div></aside>
<div class="pop" id="pop"></div>
<script src="js/core.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages.js"></script>
<script src="js/app.js"></script>
</body>
</html>
